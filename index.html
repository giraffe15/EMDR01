<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050d16" />
  <title>EMDR</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050d16; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.2';
    import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.19.2/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(h);

    const SPEEDS = [
      { label: "遅", ms: 2200 },
      { label: "普通", ms: 1200 },
      { label: "速", ms: 650 },
    ];

    function EMDRApp() {
      const [dotPos, setDotPos] = useState(50);
      const [dotX, setDotX] = useState(50);
      const [dotY, setDotY] = useState(50);
      const [mode, setMode] = useState("horizontal"); // horizontal | vertical | random
      const [vertical, setVertical] = useState(false);
      const [running, setRunning] = useState(true);
      const [speedMs, setSpeedMs] = useState(1200);
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [uiVisible, setUiVisible] = useState(false);
      const [showFull, setShowFull] = useState(false);

      const [fullPhase, setFullPhase] = useState("grounding");
      const [safePlace, setSafePlace] = useState("");
      const [targetText, setTargetText] = useState("");
      const [negBelief, setNegBelief] = useState("");
      const [bodyLocation, setBodyLocation] = useState("");
      const [sudsRating, setSudsRating] = useState(5);
      const [completedSets, setCompletedSets] = useState(0);
      const [showSuds, setShowSuds] = useState(false);
      const [breathPhase, setBreathPhase] = useState("");
      const [breathStep, setBreathStep] = useState(0);

      const audioCtxRef = useRef(null);
      const animRef = useRef(null);
      const startTimeRef = useRef(null);
      const directionRef = useRef(1);
      const hideTimerRef = useRef(null);
      const breathTimerRef = useRef(null);
      const verticalRef = useRef(false);
      const modeRef = useRef("horizontal");
      const speedMsRef = useRef(1200);
      const audioEnabledRef = useRef(true);
      // random mode
      const randFromX = useRef(50);
      const randFromY = useRef(50);
      const randToX = useRef(90);
      const randToY = useRef(50);

      useEffect(() => { verticalRef.current = vertical; }, [vertical]);
      useEffect(() => { modeRef.current = mode; }, [mode]);
      useEffect(() => { speedMsRef.current = speedMs; }, [speedMs]);
      useEffect(() => { audioEnabledRef.current = audioEnabled; }, [audioEnabled]);

      const getAudioCtx = () => {
        if (!audioCtxRef.current)
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtxRef.current;
      };

      const playTone = useCallback((side) => {
        if (!audioEnabledRef.current) return;
        try {
          const ctx = getAudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const panner = ctx.createStereoPanner();
          panner.pan.value = verticalRef.current ? 0 : (side === "left" ? -0.9 : 0.9);
          osc.frequency.value = side === "left" ? 400 : 480;
          osc.type = "sine";
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.02);
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(panner); panner.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
      }, []);

      const animate = useCallback((timestamp) => {
        if (!startTimeRef.current) startTimeRef.current = timestamp;
        const elapsed = timestamp - startTimeRef.current;
        const spd = speedMsRef.current;
        const progress = Math.min((elapsed % spd) / spd, 1);
        const m = modeRef.current;

        if (m === "random") {
          const x = randFromX.current + (randToX.current - randFromX.current) * progress;
          const y = randFromY.current + (randToY.current - randFromY.current) * progress;
          setDotX(x);
          setDotY(y);
        } else {
          const pos = directionRef.current === 1 ? 5 + progress * 90 : 95 - progress * 90;
          setDotPos(pos);
        }

        if (elapsed >= spd) {
          startTimeRef.current = timestamp;
          if (m === "random") {
            // arrived at target → set new target from current pos
            randFromX.current = randToX.current;
            randFromY.current = randToY.current;
            randToX.current = 8 + Math.random() * 84;
            randToY.current = 8 + Math.random() * 84;
            playTone(Math.random() > 0.5 ? "right" : "left");
          } else {
            const wasForward = directionRef.current === 1;
            directionRef.current *= -1;
            playTone(wasForward ? "right" : "left");
          }
        }
        animRef.current = requestAnimationFrame(animate);
      }, [playTone]);

      useEffect(() => {
        if (running) {
          startTimeRef.current = null;
          animRef.current = requestAnimationFrame(animate);
        } else {
          if (animRef.current) cancelAnimationFrame(animRef.current);
        }
        return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
      }, [running, animate]);

      const handleTouch = useCallback(() => {
        setUiVisible(true);
        if (hideTimerRef.current) clearTimeout(hideTimerRef.current);
        hideTimerRef.current = setTimeout(() => setUiVisible(false), 3000);
      }, []);

      useEffect(() => () => { if (hideTimerRef.current) clearTimeout(hideTimerRef.current); }, []);

      const startBreathing = () => {
        let step = 0;
        const durations = [4000, 2000, 6000, 2000];
        const labels = ["鼻から吸う", "止める", "口から吐く", "止める"];
        const tick = () => {
          setBreathStep(step); setBreathPhase(labels[step]);
          breathTimerRef.current = setTimeout(() => { step = (step + 1) % 4; tick(); }, durations[step]);
        };
        tick();
      };
      const stopBreathing = () => {
        if (breathTimerRef.current) clearTimeout(breathTimerRef.current);
        setBreathPhase("");
      };

      const breathColors = ["#7eb8d4", "#a8d5e2", "#5a9fc2", "#a8d5e2"];
      const breathScales = [1.15, 1.15, 0.88, 0.88];

      if (showFull) {
        const phaseLabel = { grounding: "グラウンディング", target: "ターゲット設定", processing: "処理", stabilize: "安定化", close: "終了" }[fullPhase];
        return html`
          <div style=${{ minHeight:"100vh", minWidth:"100vw", background:"linear-gradient(160deg,#0d1b2a 0%,#1a2e42 60%,#0f2233 100%)", fontFamily:"Georgia,serif", color:"#c8dce8", display:"flex", flexDirection:"column", alignItems:"center", overflowY:"auto" }}>
            <div style=${{ width:"100%", maxWidth:"600px", padding:"20px 24px 0", boxSizing:"border-box", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style=${{ fontSize:"14px", color:"#7eb8d4" }}>${phaseLabel}</div>
              <button onClick=${() => { setShowFull(false); stopBreathing(); setFullPhase("grounding"); setRunning(true); }}
                style=${{ background:"transparent", border:"1px solid rgba(120,180,210,0.2)", color:"#567a8f", padding:"6px 14px", borderRadius:"12px", cursor:"pointer", fontSize:"12px" }}>
                ← シンプルに戻る
              </button>
            </div>
            <div style=${{ width:"100%", maxWidth:"600px", padding:"20px 24px 40px", boxSizing:"border-box" }}>

              ${fullPhase === "grounding" && html`
                <div style=${{ animation:"fadeIn 0.5s ease" }}>
                  <h2 style=${{ fontSize:"20px", fontWeight:"300", marginBottom:"6px" }}>グラウンディング</h2>
                  <p style=${{ fontSize:"13px", color:"#567a8f", marginBottom:"28px" }}>体と現在に意識を向けます</p>
                  <div style=${{ display:"flex", flexDirection:"column", alignItems:"center", marginBottom:"28px" }}>
                    <div style=${{ width:"110px", height:"110px", borderRadius:"50%", background:"radial-gradient(circle, "+breathColors[breathStep]+"44 0%, transparent 70%)", border:"2px solid "+breathColors[breathStep], display:"flex", alignItems:"center", justifyContent:"center", transform:"scale("+breathScales[breathStep]+")", transition:"transform 0.8s ease, border-color 0.5s ease", boxShadow:"0 0 28px "+breathColors[breathStep]+"44", marginBottom:"12px" }}>
                      <span style=${{ fontSize:"12px", color:"#e8f2f8", textAlign:"center" }}>${breathPhase || "…"}</span>
                    </div>
                    <div style=${{ display:"flex", gap:"10px" }}>
                      <button onClick=${startBreathing} style=${{ background:"rgba(126,184,212,0.12)", border:"1px solid rgba(126,184,212,0.3)", color:"#7eb8d4", padding:"8px 16px", borderRadius:"10px", cursor:"pointer", fontSize:"12px" }}>開始</button>
                      <button onClick=${stopBreathing} style=${{ background:"transparent", border:"1px solid rgba(120,180,210,0.15)", color:"#567a8f", padding:"8px 16px", borderRadius:"10px", cursor:"pointer", fontSize:"12px" }}>止める</button>
                    </div>
                  </div>
                  <div style=${{ background:"rgba(120,180,210,0.05)", border:"1px solid rgba(120,180,210,0.12)", borderRadius:"12px", padding:"16px", marginBottom:"20px" }}>
                    <p style=${{ fontSize:"12px", color:"#7eb8d4", marginBottom:"10px" }}>5-4-3-2-1 グラウンディング</p>
                    ${[["👁","見えるもの5つ"],["✋","触れるもの4つ"],["👂","聞こえるもの3つ"],["👃","匂い2つ"],["👅","味1つ"]].map(([icon,label]) => html`
                      <div style=${{ display:"flex", gap:"10px", padding:"5px 0", borderBottom:"1px solid rgba(120,180,210,0.07)", fontSize:"13px" }}>
                        <span>${icon}</span><span style=${{ color:"#8aacbe" }}>${label}</span>
                      </div>`)}
                  </div>
                  <div style=${{ marginBottom:"20px" }}>
                    <label style=${{ fontSize:"12px", color:"#7eb8d4", display:"block", marginBottom:"8px" }}>安全な場所を思い浮かべてください</label>
                    <input value=${safePlace} onInput=${e => setSafePlace(e.target.value)} placeholder="例：山の湖畔、祖父母の縁側…"
                      style=${{ width:"100%", background:"rgba(120,180,210,0.07)", border:"1px solid rgba(120,180,210,0.2)", borderRadius:"8px", padding:"10px 12px", color:"#c8dce8", fontSize:"14px", outline:"none", boxSizing:"border-box" }} />
                  </div>
                  <button onClick=${() => { stopBreathing(); setFullPhase("target"); }}
                    style=${{ width:"100%", padding:"14px", background:"rgba(126,184,212,0.1)", border:"1px solid rgba(126,184,212,0.28)", borderRadius:"12px", color:"#7eb8d4", fontSize:"15px", cursor:"pointer" }}>次へ →</button>
                </div>`}

              ${fullPhase === "target" && html`
                <div style=${{ animation:"fadeIn 0.5s ease" }}>
                  <h2 style=${{ fontSize:"20px", fontWeight:"300", marginBottom:"6px" }}>ターゲット設定</h2>
                  <p style=${{ fontSize:"13px", color:"#567a8f", marginBottom:"24px" }}>今日扱う記憶・感覚を特定します</p>
                  <div style=${{ display:"flex", flexDirection:"column", gap:"14px", marginBottom:"20px" }}>
                    <div>
                      <label style=${{ fontSize:"12px", color:"#7eb8d4", display:"block", marginBottom:"6px" }}>ターゲットとなる記憶・場面</label>
                      <textarea value=${targetText} onInput=${e => setTargetText(e.target.value)} rows="3" placeholder="簡単に記述（詳細は不要）"
                        style=${{ width:"100%", background:"rgba(120,180,210,0.06)", border:"1px solid rgba(120,180,210,0.2)", borderRadius:"8px", padding:"10px 12px", color:"#c8dce8", fontSize:"14px", outline:"none", resize:"vertical", boxSizing:"border-box", fontFamily:"inherit" }}></textarea>
                    </div>
                    <div>
                      <label style=${{ fontSize:"12px", color:"#7eb8d4", display:"block", marginBottom:"6px" }}>ネガティブな信念 (NC)</label>
                      <input value=${negBelief} onInput=${e => setNegBelief(e.target.value)} placeholder="例：私は価値がない"
                        style=${{ width:"100%", background:"rgba(120,180,210,0.06)", border:"1px solid rgba(120,180,210,0.2)", borderRadius:"8px", padding:"10px 12px", color:"#c8dce8", fontSize:"14px", outline:"none", boxSizing:"border-box" }} />
                    </div>
                    <div>
                      <label style=${{ fontSize:"12px", color:"#7eb8d4", display:"block", marginBottom:"6px" }}>体のどこで感じる？</label>
                      <input value=${bodyLocation} onInput=${e => setBodyLocation(e.target.value)} placeholder="例：胸の締まり、喉の詰まり"
                        style=${{ width:"100%", background:"rgba(120,180,210,0.06)", border:"1px solid rgba(120,180,210,0.2)", borderRadius:"8px", padding:"10px 12px", color:"#c8dce8", fontSize:"14px", outline:"none", boxSizing:"border-box" }} />
                    </div>
                    <div>
                      <label style=${{ fontSize:"12px", color:"#7eb8d4", display:"block", marginBottom:"10px" }}>
                        苦痛レベル (SUDS): <span style=${{ color:"#e8c88a", fontSize:"16px" }}>${sudsRating}</span> / 10
                      </label>
                      <input type="range" min="0" max="10" value=${sudsRating} onInput=${e => setSudsRating(Number(e.target.value))} style=${{ width:"100%", accentColor:"#7eb8d4" }} />
                      <div style=${{ display:"flex", justifyContent:"space-between", fontSize:"11px", color:"#456070", marginTop:"4px" }}>
                        <span>0 平和</span><span>5 中程度</span><span>10 最大</span>
                      </div>
                    </div>
                  </div>
                  <div style=${{ display:"flex", gap:"10px" }}>
                    <button onClick=${() => setFullPhase("grounding")} style=${{ padding:"12px 18px", background:"transparent", border:"1px solid rgba(120,180,210,0.15)", borderRadius:"12px", color:"#567a8f", cursor:"pointer", fontSize:"13px" }}>← 戻る</button>
                    <button onClick=${() => targetText.trim() && setFullPhase("processing")}
                      style=${{ flex:1, padding:"14px", background:targetText.trim()?"rgba(126,184,212,0.1)":"rgba(120,180,210,0.04)", border:"1px solid "+(targetText.trim()?"rgba(126,184,212,0.28)":"rgba(120,180,210,0.1)"), borderRadius:"12px", color:targetText.trim()?"#7eb8d4":"#3a5a6f", cursor:targetText.trim()?"pointer":"not-allowed", fontSize:"15px" }}>処理へ →</button>
                  </div>
                </div>`}

              ${fullPhase === "processing" && html`
                <div style=${{ animation:"fadeIn 0.5s ease" }}>
                  <h2 style=${{ fontSize:"20px", fontWeight:"300", marginBottom:"4px" }}>処理フェーズ</h2>
                  <p style=${{ fontSize:"12px", color:"#567a8f", marginBottom:"20px" }}>セット ${completedSets + 1} — 記憶と感覚をただ観察してください</p>
                  <div style=${{ width:"100%", height:"100px", background:"#050d16", borderRadius:"16px", position:"relative", marginBottom:"20px", overflow:"hidden" }}>
                    <div style=${{ position:"absolute", top:"50%", left:"5%", right:"5%", height:"1px", background:"linear-gradient(90deg,transparent,rgba(126,184,212,0.1),transparent)" }}></div>
                    <div style=${{ position:"absolute", left:dotPos+"%", top:"50%", transform:"translate(-50%,-50%)", width:"24px", height:"24px", borderRadius:"50%", background:"radial-gradient(circle at 35% 35%, #b8dff0, #4a9fc0)", boxShadow:"0 0 20px #7eb8d4cc" }}></div>
                  </div>
                  <div style=${{ display:"flex", gap:"10px", marginBottom:"16px" }}>
                    <button onClick=${() => setRunning(r => !r)}
                      style=${{ flex:1, padding:"13px", background:running?"rgba(220,100,100,0.1)":"rgba(126,184,212,0.12)", border:"1px solid "+(running?"rgba(220,100,100,0.25)":"rgba(126,184,212,0.3)"), borderRadius:"12px", color:running?"#e89090":"#7eb8d4", fontSize:"14px", cursor:"pointer" }}>
                      ${running ? "⏸ 停止" : "▶ 開始"}
                    </button>
                    <button onClick=${() => { setRunning(false); setShowSuds(true); }}
                      style=${{ padding:"13px 16px", background:"rgba(120,180,210,0.06)", border:"1px solid rgba(120,180,210,0.15)", borderRadius:"12px", color:"#567a8f", fontSize:"13px", cursor:"pointer" }}>セット終了</button>
                  </div>
                  ${showSuds && html`
                    <div style=${{ background:"rgba(120,180,210,0.07)", border:"1px solid rgba(120,180,210,0.2)", borderRadius:"12px", padding:"18px", animation:"fadeIn 0.3s ease" }}>
                      <p style=${{ fontSize:"13px", color:"#a0c4d8", marginBottom:"10px" }}>今の苦痛レベルは？</p>
                      <input type="range" min="0" max="10" value=${sudsRating} onInput=${e => setSudsRating(Number(e.target.value))} style=${{ width:"100%", accentColor:"#7eb8d4", marginBottom:"8px" }} />
                      <div style=${{ textAlign:"center", fontSize:"22px", color:"#e8c88a", marginBottom:"14px" }}>${sudsRating}</div>
                      <div style=${{ display:"flex", gap:"10px" }}>
                        <button onClick=${() => { setCompletedSets(s => s+1); setShowSuds(false); setRunning(true); }}
                          style=${{ flex:1, padding:"10px", background:"rgba(126,184,212,0.1)", border:"1px solid rgba(126,184,212,0.25)", borderRadius:"10px", color:"#7eb8d4", cursor:"pointer", fontSize:"12px" }}>もう1セット</button>
                        <button onClick=${() => { setShowSuds(false); setFullPhase("stabilize"); startBreathing(); }}
                          style=${{ flex:1, padding:"10px", background:"rgba(120,180,210,0.05)", border:"1px solid rgba(120,180,210,0.15)", borderRadius:"10px", color:"#567a8f", cursor:"pointer", fontSize:"12px" }}>安定化へ</button>
                      </div>
                    </div>`}
                </div>`}

              ${fullPhase === "stabilize" && html`
                <div style=${{ animation:"fadeIn 0.5s ease" }}>
                  <h2 style=${{ fontSize:"20px", fontWeight:"300", marginBottom:"6px" }}>安定化</h2>
                  <p style=${{ fontSize:"13px", color:"#567a8f", marginBottom:"24px" }}>処理の後、丁寧に現在に戻ります</p>
                  ${safePlace && html`
                    <div style=${{ background:"rgba(126,184,212,0.06)", border:"1px solid rgba(126,184,212,0.18)", borderRadius:"12px", padding:"18px", marginBottom:"20px" }}>
                      <p style=${{ fontSize:"12px", color:"#7eb8d4", marginBottom:"6px" }}>安全な場所</p>
                      <p style=${{ fontSize:"15px", fontStyle:"italic", color:"#c8dce8" }}>「${safePlace}」</p>
                      <p style=${{ fontSize:"13px", color:"#8aacbe", lineHeight:"1.8", marginTop:"8px" }}>その場所の色・光・温度・音を思い浮かべてください。</p>
                    </div>`}
                  <div style=${{ display:"flex", flexDirection:"column", alignItems:"center", marginBottom:"24px" }}>
                    <div style=${{ width:"100px", height:"100px", borderRadius:"50%", background:"radial-gradient(circle, "+breathColors[breathStep]+"44 0%, transparent 70%)", border:"2px solid "+breathColors[breathStep], display:"flex", alignItems:"center", justifyContent:"center", transform:"scale("+breathScales[breathStep]+")", transition:"transform 0.8s ease", boxShadow:"0 0 24px "+breathColors[breathStep]+"33", marginBottom:"10px" }}>
                      <span style=${{ fontSize:"11px", color:"#e8f2f8" }}>${breathPhase || "…"}</span>
                    </div>
                  </div>
                  <div style=${{ background:"rgba(120,180,210,0.05)", border:"1px solid rgba(120,180,210,0.1)", borderRadius:"12px", padding:"14px", marginBottom:"20px" }}>
                    <p style=${{ fontSize:"12px", color:"#7eb8d4", marginBottom:"6px" }}>コンテナ技法</p>
                    <p style=${{ fontSize:"13px", color:"#8aacbe", lineHeight:"1.8" }}>まだ処理しきれていないものを頑丈な容器にしまうイメージを持ちます。今日扱えなかった部分は、そこに安全に保管できます。</p>
                  </div>
                  <button onClick=${() => { stopBreathing(); setFullPhase("close"); }}
                    style=${{ width:"100%", padding:"14px", background:"rgba(126,184,212,0.1)", border:"1px solid rgba(126,184,212,0.28)", borderRadius:"12px", color:"#7eb8d4", fontSize:"15px", cursor:"pointer" }}>終了へ →</button>
                </div>`}

              ${fullPhase === "close" && html`
                <div style=${{ animation:"fadeIn 0.5s ease" }}>
                  <h2 style=${{ fontSize:"20px", fontWeight:"300", marginBottom:"6px" }}>お疲れさまでした</h2>
                  <p style=${{ fontSize:"13px", color:"#567a8f", marginBottom:"24px" }}>セッション完了</p>
                  <div style=${{ background:"rgba(120,180,210,0.05)", border:"1px solid rgba(120,180,210,0.12)", borderRadius:"12px", padding:"18px", marginBottom:"24px" }}>
                    <p style=${{ fontSize:"13px", color:"#b0ccd8", lineHeight:"1.9" }}>急いで動かず、しばらく体を感じてください。水分を摂る、軽く体を動かすなど、自分を労わってください。強い感情が続く場合は専門家に相談することをお勧めします。</p>
                  </div>
                  <button onClick=${() => { setShowFull(false); setFullPhase("grounding"); setTargetText(""); setNegBelief(""); setBodyLocation(""); setSudsRating(5); setCompletedSets(0); setShowSuds(false); setSafePlace(""); setRunning(true); }}
                    style=${{ width:"100%", padding:"14px", background:"rgba(126,184,212,0.1)", border:"1px solid rgba(126,184,212,0.28)", borderRadius:"12px", color:"#7eb8d4", fontSize:"14px", cursor:"pointer" }}>
                    シンプルモードへ
                  </button>
                </div>`}
            </div>
          </div>`;
      }

      const isRandom = mode === "random";
      const isVertical = mode === "vertical";

      const dotStyleObj = isRandom
        ? { position:"absolute", left:dotX+"%", top:dotY+"%", transform:"translate(-50%,-50%)" }
        : isVertical
          ? { position:"absolute", left:"50%", top:dotPos+"%", transform:"translate(-50%,-50%)" }
          : { position:"absolute", left:dotPos+"%", top:"50%", transform:"translate(-50%,-50%)" };

      const trackStyleObj = isRandom
        ? null
        : isVertical
          ? { position:"absolute", top:"5%", bottom:"5%", left:"50%", width:"1px", transform:"translateX(-50%)", background:"linear-gradient(180deg,transparent,rgba(126,184,212,0.08),transparent)" }
          : { position:"absolute", left:"5%", right:"5%", top:"50%", height:"1px", transform:"translateY(-50%)", background:"linear-gradient(90deg,transparent,rgba(126,184,212,0.08),transparent)" };

      const modeLabel = mode === "horizontal" ? "↕ 縦" : mode === "vertical" ? "🎲 ランダム" : "↔ 横";
      const nextMode = mode === "horizontal" ? "vertical" : mode === "vertical" ? "random" : "horizontal";

      return html`
        <div
          onMouseDown=${handleTouch}
          onTouchStart=${handleTouch}
          style=${{ width:"100vw", height:"100vh", background:"#050d16", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden", position:"relative", cursor:"none", userSelect:"none" }}
        >
          ${!isRandom && html`<div style=${trackStyleObj}></div>`}
          <div style=${{ ...dotStyleObj, width:"28px", height:"28px", borderRadius:"50%", background:"radial-gradient(circle at 35% 35%, #c8e8f8, #3a8fb8)", boxShadow:"0 0 32px #7eb8d4bb, 0 0 8px #7eb8d4", zIndex:10 }}></div>
          <div style=${{ position:"absolute", inset:0, display:"flex", flexDirection:"column", justifyContent:"space-between", padding:"env(safe-area-inset-top,20px) 24px env(safe-area-inset-bottom,24px)", opacity:uiVisible?1:0, transition:"opacity 0.4s ease", pointerEvents:uiVisible?"auto":"none", zIndex:20 }}>
            <div style=${{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style=${{ fontSize:"11px", letterSpacing:"3px", color:"rgba(126,184,212,0.4)", textTransform:"uppercase" }}>EMDR</div>
              <button
                onMouseDown=${e => { e.stopPropagation(); setRunning(r => !r); handleTouch(); }}
                onTouchStart=${e => { e.stopPropagation(); setRunning(r => !r); handleTouch(); }}
                style=${{ background:running?"rgba(220,100,100,0.12)":"rgba(126,184,212,0.15)", border:"1px solid "+(running?"rgba(220,100,100,0.3)":"rgba(126,184,212,0.3)"), color:running?"#e89090":"#7eb8d4", padding:"8px 18px", borderRadius:"20px", cursor:"pointer", fontSize:"13px" }}
              >${running ? "⏸ 停止" : "▶ 再開"}</button>
            </div>
            <div style=${{ display:"flex", flexDirection:"column", gap:"10px" }}>
              <div style=${{ display:"flex", gap:"8px", justifyContent:"center" }}>
                ${SPEEDS.map(s => html`
                  <button key=${s.ms}
                    onMouseDown=${e => { e.stopPropagation(); setSpeedMs(s.ms); handleTouch(); }}
                    onTouchStart=${e => { e.stopPropagation(); setSpeedMs(s.ms); handleTouch(); }}
                    style=${{ padding:"8px 20px", background:speedMs===s.ms?"rgba(126,184,212,0.2)":"rgba(255,255,255,0.05)", border:"1px solid "+(speedMs===s.ms?"rgba(126,184,212,0.4)":"rgba(255,255,255,0.1)"), borderRadius:"20px", color:speedMs===s.ms?"#7eb8d4":"rgba(126,184,212,0.4)", cursor:"pointer", fontSize:"13px" }}
                  >${s.label}</button>`)}
              </div>
              <div style=${{ display:"flex", gap:"8px", justifyContent:"center", flexWrap:"wrap" }}>
                <button
                  onMouseDown=${e => { e.stopPropagation(); setMode(nextMode); startTimeRef.current=null; handleTouch(); }}
                  onTouchStart=${e => { e.stopPropagation(); setMode(nextMode); startTimeRef.current=null; handleTouch(); }}
                  style=${{ padding:"8px 18px", background:"rgba(126,184,212,0.12)", border:"1px solid rgba(126,184,212,0.28)", borderRadius:"20px", color:"#7eb8d4", cursor:"pointer", fontSize:"13px" }}
                >${modeLabel}に切替</button>
                <button
                  onMouseDown=${e => { e.stopPropagation(); setAudioEnabled(a => !a); handleTouch(); }}
                  onTouchStart=${e => { e.stopPropagation(); setAudioEnabled(a => !a); handleTouch(); }}
                  style=${{ padding:"8px 18px", background:audioEnabled?"rgba(126,184,212,0.12)":"rgba(255,255,255,0.04)", border:"1px solid "+(audioEnabled?"rgba(126,184,212,0.3)":"rgba(255,255,255,0.1)"), borderRadius:"20px", color:audioEnabled?"#7eb8d4":"rgba(126,184,212,0.3)", cursor:"pointer", fontSize:"13px" }}
                >${audioEnabled ? "🎧 音あり" : "🔇 音なし"}</button>
                <button
                  onMouseDown=${e => { e.stopPropagation(); setShowFull(true); setRunning(false); }}
                  onTouchStart=${e => { e.stopPropagation(); setShowFull(true); setRunning(false); }}
                  style=${{ padding:"8px 18px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"20px", color:"rgba(126,184,212,0.4)", cursor:"pointer", fontSize:"13px" }}
                >フルセッション</button>
              </div>
              <p style=${{ textAlign:"center", fontSize:"11px", color:"rgba(126,184,212,0.18)", margin:0 }}>画面から離すとUIが消えます</p>
            </div>
          </div>
        </div>`;
    }

    render(h(EMDRApp, null), document.getElementById('app'));
  </script>
</body>
</html>
